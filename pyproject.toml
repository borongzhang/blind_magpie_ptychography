[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blind-magpie"
version = "0.4.0"
description = "Synthetic blind ptychography reproduction and executed result notebooks."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26", "pandas>=2.2", "matplotlib>=3.9", "pillow>=10"]

[project.optional-dependencies]
notebooks = ["ipykernel", "jupyterlab"]
reconstruction = [
    "ptychi @ git+https://github.com/AdvancedPhotonSource/pty-chi.git@9bff0739cc91b9ec58f49341429bd955a767389d",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy==2.4.6",
    "pandas==3.1.0",
    "scipy==1.17.1",
    "pydantic==2.14.2",
    "imageio",
    "scikit-image",
    "h5py",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["blind_magpie*"]

[tool.setuptools.package-data]
blind_magpie = ["assets/*.tif", "assets/*.tiff"]
