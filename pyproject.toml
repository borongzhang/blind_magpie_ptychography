[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blind-magpie"
version = "0.2.0"
description = "MAGPIE blind ptychography: synthetic overlap, noise, and measured-data experiments."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "h5py>=3.16,<3.17",
    "imageio>=2.37,<2.38",
    "numpy>=2.4,<2.5",
    "ptychi==1.4.0",
    "scikit-image>=0.26,<0.27",
    "torch>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=7.2,<7.3",
    "jupyterlab>=4.5,<4.6",
    "matplotlib>=3.10,<3.11",
]

[tool.setuptools.packages.find]
where = ["src"]
