[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blind-magpie"
version = "0.1.0"
description = "Synthetic and real-data experiments for blind MAGPIE ptychographic reconstruction."
requires-python = ">=3.11"
dependencies = [
    "h5py",
    "imageio",
    "numpy",
    "ptychi",
    "scikit-image",
    "torch",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
